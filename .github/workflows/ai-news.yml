name: Collect and publish AI news
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-news.yml'
      - 'scripts/news/**'
      - 'config/news-sources.json'
      - 'tests/news*.mjs'
      - 'tests/news*.cjs'
      - '.npmrc'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
  schedule:
    # Every two hours, at minute 35; daily caps are shared across all runs.
    - cron: '35 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-news-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.NEWS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Next.js dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Test collector
        run: node --test tests/news.test.mjs tests/news-full-feed.test.mjs tests/news-feed.test.cjs
      - name: Collect a filtered batch
        env:
          NEWS_SUMMARIZE: 'false'
          NEWS_LLM_URL: ${{ vars.NEWS_LLM_URL }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
        run: node scripts/news/collect.mjs --write
      - name: Validate news and build all locales
        run: |
          npm run news:check
          npm run build
      - name: Publish only validated content
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/news/items.json
          if [ -d src/pages/news/daily ]; then git add -- src/pages/news/daily; fi
          if git diff --cached --quiet; then
            echo 'No new eligible news.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              data/news/items.json|src/pages/news/daily/*.md) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: publish automatically checked AI news'
          git push origin "HEAD:$TARGET_BRANCH"
          echo 'Rules, content checks and all-locale build passed; content published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize collection outcome
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.cache-loader/news-report.json';
          if (!fs.existsSync(file)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nCollection report unavailable; check the preceding setup/install steps.\n');
          } else {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const lines = ['\n## Collection outcome', `Run: ${report.runAt}`, `Selected: ${report.selected.length}`, `Rejected by relevance rules: ${report.rejected?.length || 0}`];
            for (const source of report.sources) lines.push(`- ${source.source}: ${source.status}; eligible before relevance/deduplication: ${source.eligible ?? 0}`);
            if (!report.selected.length) lines.push('No new eligible items after filtering, deduplication and daily limits. This does not mean the feed is empty.');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }
          NODE
      - name: Preserve collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-run-report
          include-hidden-files: true
          path: |
            .cache-loader/news-report.json
            .cache-loader/news-pr.md
          if-no-files-found: ignore
          retention-days: 30
