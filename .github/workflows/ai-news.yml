name: Collect and publish AI news
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-news.yml'
      - 'scripts/news/**'
      - 'config/news-sources.json'
      - 'tests/news*.mjs'
      - 'tests/news*.cjs'
      - '.npmrc'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
  schedule:
    # Off-hour retry opportunities. Schedule checks keep real collection near two hours apart.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Publication lookback hours (1–336); daily limits still apply'
        default: '48'
        type: string
permissions:
  contents: read
concurrency:
  group: ai-news-collection
  cancel-in-progress: false
jobs:
  schedule-check:
    if: github.event_name == 'schedule' && vars.NEWS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      should_collect: ${{ steps.check.outputs.should_collect }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Check recent successful collection
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/news/schedule.mjs
  collect:
    needs: schedule-check
    if: ${{ !cancelled() && vars.NEWS_ENABLED != 'false' && (github.event_name != 'schedule' || needs.schedule-check.outputs.should_collect != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Next.js dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Test collector
        run: npm run test:news
      - name: Collect a filtered batch
        env:
          NEWS_SUMMARIZE: 'false'
          NEWS_WINDOW_HOURS: ${{ inputs.window_hours || '48' }}
          NEWS_LLM_URL: ${{ vars.NEWS_LLM_URL }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
        run: node scripts/news/collect.mjs --write
      - name: Validate news and build all locales
        run: |
          npm run news:check
          npm run build
      - name: Publish only validated content
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/news/items.json
          if [ -d src/pages/news/daily ]; then git add -- src/pages/news/daily; fi
          if git diff --cached --quiet; then
            echo 'No new eligible news.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              data/news/items.json|src/pages/news/daily/*.md) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: publish automatically checked AI news'
          node scripts/news/push.mjs
          echo 'Rules, content checks and all-locale build passed; content published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize collection outcome
        if: always()
        run: node scripts/news/report.mjs
      - name: Preserve collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-run-report
          include-hidden-files: true
          path: |
            .cache-loader/news-report.json
            .cache-loader/news-pr.md
          if-no-files-found: ignore
          retention-days: 30
