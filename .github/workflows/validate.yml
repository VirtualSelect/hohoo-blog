name: Validate blog changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - run: npm run test:web
      - run: node --test tests/content-index.test.cjs tests/learning-progress.test.mjs tests/radar.test.cjs
      - run: npm run test:news
      - run: node --test tests/learning-index.test.cjs
      - run: node --test tests/reading-state.test.mjs
      - run: node --test tests/papers.test.mjs
      - run: node --test tests/news-feed.test.cjs
      - run: node --test tests/news-timeline.test.mjs
      - run: npm run news:check
      - run: npm run build
