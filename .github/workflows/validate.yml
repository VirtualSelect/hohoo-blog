name: Validate blog changes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Check application formatting
        run: npm run format:check
      - name: Check application types
        run: npm run typecheck
      - run: npm run test:web
      - run: node --test tests/content-index.test.cjs tests/learning-progress.test.mjs tests/radar.test.cjs
      - run: npm run test:news
      - run: node --test tests/learning-index.test.cjs
      - run: node --test tests/reading-state.test.mjs
      - run: node --test tests/papers.test.mjs
      - run: node --test tests/news-feed.test.cjs
      - run: node --test tests/news-timeline.test.mjs
      - run: npm run news:check
      - run: npm run build
      - name: Review deployment output size
        env:
          STORAGE_STATIC_BUDGET_MB: '350'
        run: npm run storage:check --prefix apps/web
